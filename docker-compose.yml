version: '3.8'

services:
  processor:
    image: satheeshds/paperless-document-processor
    build: .
    container_name: paperless-ai-processor
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # Nexus gateway (see github.com/satheeshds/nexus)
      - NEXUS_HOST=${NEXUS_HOST:-nexus-gateway}
      - NEXUS_PORT=${NEXUS_PORT:-5433}
      - NEXUS_DB=${NEXUS_DB:-lake}
      # Nexus control API (required for per-tenant service account rotation)
      - NEXUS_CONTROL_URL=${NEXUS_CONTROL_URL}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      # Pass these from .env file or host environment
      - PAPERLESS_URL=${PAPERLESS_URL}
      - PAPERLESS_USERNAME=${PAPERLESS_USERNAME}
      - PAPERLESS_PASSWORD=${PAPERLESS_PASSWORD}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}
      - DOCUMENT_AI_PROCESSOR_ID=${DOCUMENT_AI_PROCESSOR_ID}
      # If using key file:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/config/service-account.json
      # Accounting (optional; credentials come from service account rotation)
      - ACCOUNTING_URL=${ACCOUNTING_URL}
    volumes:
      - /path/to/paperless/media:/app/media:ro
      # Mount the service account key
      - ./service-account.json:/app/config/service-account.json:ro
